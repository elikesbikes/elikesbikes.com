<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="n8n in the middle, wired to Graylog, Home Assistant, Proxmox, Garmin and UniFi">
  <!-- Recent-project picture for the home page, drawn in the Interstellar palette:
       bg #06080b, panel #161a21, border #2b313b, amber #f0a23b, data #9fc4e8, text #e6e8ec, muted #8a909c.
       Loaded through <img>, so it cannot use the page's web fonts; the stack below falls back to the system monospace. -->
  <defs>
    <radialGradient id="hubGlow">
      <stop offset="0" stop-color="#f0a23b" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#f0a23b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#161a21" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>
  <style>
    text { font-family: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace; }
    .label { font-size: 15px; font-weight: 500; letter-spacing: 1.5px; fill: #e6e8ec; text-anchor: middle; }
    .tag { font-size: 13px; letter-spacing: 2.6px; fill: #8a909c; }
    .node { fill: #161a21; stroke: #2b313b; stroke-width: 1.2; }
    .ico { fill: none; stroke: #9fc4e8; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .ico-dot { fill: #9fc4e8; }
    .wire { stroke: #2b313b; stroke-width: 1.2; stroke-dasharray: 4 5; }
    .flow { fill: #f0a23b; }
    @media (prefers-reduced-motion: reduce) { .flow { display: none; } }
  </style>

  <rect width="800" height="450" fill="#06080b"/>
  <rect width="800" height="450" fill="url(#grid)"/>
  <circle cx="400" cy="225" r="180" fill="url(#hubGlow)"/>

  <!-- corner readouts -->
  <rect x="28" y="27" width="6" height="6" fill="#f0a23b"/>
  <text class="tag" x="44" y="35">HOMELAB</text>
  <text class="tag" x="772" y="35" text-anchor="end">5 INTEGRATIONS</text>
  <text class="tag" x="401" y="420" text-anchor="middle">VISUAL WORKFLOW AUTOMATION</text>

  <!-- wires, hub to each service (the boxes drawn later cover the ends) -->
  <g class="wire">
    <line x1="400" y1="225" x2="400" y2="64"/>
    <line x1="400" y1="225" x2="128" y2="142"/>
    <line x1="400" y1="225" x2="672" y2="142"/>
    <line x1="400" y1="225" x2="128" y2="310"/>
    <line x1="400" y1="225" x2="672" y2="310"/>
  </g>

  <!-- data moving out along the wires -->
  <g class="flow">
    <circle r="2.6"><animateMotion dur="2.6s" repeatCount="indefinite" path="M400,225 L400,64"/></circle>
    <circle r="2.6"><animateMotion dur="3.4s" begin="-1.2s" repeatCount="indefinite" path="M400,225 L128,142"/></circle>
    <circle r="2.6"><animateMotion dur="3.1s" begin="-0.6s" repeatCount="indefinite" path="M400,225 L672,142"/></circle>
    <circle r="2.6"><animateMotion dur="3.7s" begin="-2.1s" repeatCount="indefinite" path="M400,225 L128,310"/></circle>
    <circle r="2.6"><animateMotion dur="3.3s" begin="-1.7s" repeatCount="indefinite" path="M400,225 L672,310"/></circle>
  </g>

  <!-- Graylog: log search -->
  <rect class="node" x="316" y="18" width="168" height="92" rx="8"/>
  <g class="ico" transform="translate(384 34)">
    <circle cx="14" cy="14" r="9"/>
    <path d="M20.5 20.5 28 28M10 12h8M10 16h5"/>
  </g>
  <text class="label" x="401" y="90">GRAYLOG</text>

  <!-- Home Assistant: house -->
  <rect class="node" x="44" y="96" width="168" height="92" rx="8"/>
  <g class="ico" transform="translate(112 112)">
    <path d="M4 15 16 4l12 11M7 13v14h18V13M13 27v-8h6v8"/>
  </g>
  <text class="label" x="129" y="168">HOME ASSISTANT</text>

  <!-- Proxmox: stacked hosts -->
  <rect class="node" x="588" y="96" width="168" height="92" rx="8"/>
  <g class="ico" transform="translate(656 112)">
    <rect x="4" y="5" width="24" height="9" rx="2"/>
    <rect x="4" y="18" width="24" height="9" rx="2"/>
    <path d="M14 9.5h9M14 22.5h9"/>
  </g>
  <g class="ico-dot" transform="translate(656 112)">
    <circle cx="9" cy="9.5" r="1.3"/>
    <circle cx="9" cy="22.5" r="1.3"/>
  </g>
  <text class="label" x="673" y="168">PROXMOX</text>

  <!-- Garmin: watch -->
  <rect class="node" x="44" y="264" width="168" height="92" rx="8"/>
  <g class="ico" transform="translate(112 280)">
    <circle cx="16" cy="16" r="9.5"/>
    <path d="M16 10.5V16l3.8 2.6M11.6 7.6 12.8 2h6.4l1.2 5.6M11.6 24.4 12.8 30h6.4l1.2-5.6"/>
  </g>
  <text class="label" x="129" y="336">GARMIN</text>

  <!-- UniFi: wireless -->
  <rect class="node" x="588" y="264" width="168" height="92" rx="8"/>
  <g class="ico" transform="translate(656 280)">
    <path d="M4 13a17 17 0 0 1 24 0M8.5 18a11 11 0 0 1 15 0M13 23a5 5 0 0 1 6 0"/>
  </g>
  <circle class="ico-dot" cx="672" cy="307" r="1.6"/>
  <text class="label" x="673" y="336">UNIFI</text>

  <!-- n8n hub -->
  <rect x="322" y="175" width="156" height="100" rx="10" fill="#f0a23b" opacity="0.28" filter="url(#soft)"/>
  <rect x="322" y="175" width="156" height="100" rx="10" fill="#161a21" stroke="#f0a23b" stroke-width="1.5"/>
  <text x="400" y="234" text-anchor="middle" font-size="38" font-weight="700" fill="#f0a23b">n8n</text>
  <text class="tag" x="402" y="258" text-anchor="middle" style="font-size:12px">WORKFLOW</text>
</svg>
