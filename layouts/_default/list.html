{{ define "main" }}
<div class="page page-narrow">
  <header class="page-head"><div><h1 class="page-title">{{ .Title }}</h1></div></header>
  {{ with .Content }}<div class="prose-interstellar page-intro">{{ . }}</div>{{ end }}
  {{ with .Pages }}
  <div class="rows">
    {{ range .ByDate.Reverse }}
    <a class="row" href="{{ .RelPermalink }}"><span class="when mono">{{ .Date.Format "2006-01-02" }}</span><span>{{ .Title }}</span></a>
    {{ end }}
  </div>
  {{ end }}
</div>
{{ end }}
