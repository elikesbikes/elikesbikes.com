{{ define "main" }}
<div class="page">
  <header class="page-head">
    <div>
      <h1 class="page-title">{{ .Title }}</h1>
      <p class="page-sub mono">{{ len .Pages }} videos · <a href="https://www.youtube.com/@ELIKESBIKES" target="_blank" rel="noopener">@ELIKESBIKES</a></p>
    </div>
    <a class="btn" href="https://www.youtube.com/@ELIKESBIKES?sub_confirmation=1" target="_blank" rel="noopener">
      {{ partial "brand-icon.html" (dict "name" "youtube" "color" "#ff4444" "size" 14) }} Subscribe
    </a>
  </header>
  {{ with .Content }}<div class="prose-interstellar page-intro">{{ . }}</div>{{ end }}
  <div class="grid grid-videos">
    {{ range .Pages.ByDate.Reverse }}{{ partial "video-card.html" . }}{{ end }}
  </div>
</div>
{{ end }}
