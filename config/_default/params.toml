# Blowfish theme parameters — see https://blowfish.page/docs/configuration/
# Look: Interstellar console theme (dark only). Scheme in assets/css/schemes/interstellar.css,
# everything else in assets/css/custom.css.
colorScheme = "interstellar"
defaultAppearance = "dark"
autoSwitchAppearance = false
enableSearch = true
disableImageZoom = true

[header]
  layout = "fixed"

[footer]
  showCopyright = true
  showThemeAttribution = true
  showAppearanceSwitcher = false
  showScrollToTop = true

[taxonomy]
  showTermCount = true

[term]
  cardView = false
