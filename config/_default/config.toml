baseURL = "https://elikesbikes.com/"
languageCode = "en"
title = "elikesbikes"
# Blowfish is loaded as a Hugo module (config/_default/module.toml + go.mod); no themes/ dir.
defaultContentLanguage = "en"

# Enable tags for Topics page
[taxonomies]
  tag = "tags"

# Keep draft and future content visible when testing locally
buildDrafts = true
buildFuture = true

[params]
  mainSections = ["videos"]
